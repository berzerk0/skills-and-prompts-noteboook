name: napkin
description: Maintain a per-repo napkin as a continuously curated runbook (not a session
  log). Activates EVERY session. Read and curate before work, keep only recurring
  high-value guidance, organize by priority-sorted categories, cap each category at
  top 10 items. The napkin lives at .vibe/napkin.md.
