# Codeberg Skill - Canonical Definition
# This is the single source of truth for the codeberg skill
# Generation scripts will create per-agent wrappers from this file

name: codeberg
description: Codeberg API operations. Use when user requests repository management, issue tracking, or Codeberg-related tasks.
license: MIT
compatibility: [claude, pi, vibe]

# Skill type classification
skill_type: type_b  # type_a = pure function, type_b = api client, type_c = file operations

# Implementation details
implementation_module: codeberg_connector.py
implementation_classes:
  - CodebergClient
  - SyncCodebergClient

# API details
api_base_url: "https://codeberg.org/api/v1"
api_type: gitea  # Codeberg uses Gitea API

# Authentication
authentication:
  method: token
  env_var: CODEBERG_TOKEN
  required: false  # Some operations work without auth

# Available operations
operations:
  - name: list_repos
    description: List repositories for user or organization
    parameters:
      - name: user
        type: string
        optional: true
      - name: org
        type: string
        optional: true
      - name: limit
        type: integer
        default: 30
      - name: page
        type: integer
        default: 1

  - name: get_repo
    description: Get a single repository by full name
    parameters:
      - name: repo_full_name
        type: string
        required: true

  - name: create_repo
    description: Create a new repository
    parameters:
      - name: name
        type: string
        required: true
      - name: description
        type: string
        optional: true
      - name: private
        type: boolean
        default: false
      - name: auto_init
        type: boolean
        default: false

  - name: delete_repo
    description: Delete a repository
    parameters:
      - name: repo_full_name
        type: string
        required: true

  - name: list_issues
    description: List issues for a repository
    parameters:
      - name: repo_full_name
        type: string
        required: true
      - name: state
        type: string
        default: "open"
      - name: labels
        type: string
        optional: true
      - name: milestone
        type: integer
        optional: true
      - name: limit
        type: integer
        default: 30
      - name: page
        type: integer
        default: 1

  - name: get_issue
    description: Get a single issue
    parameters:
      - name: repo_full_name
        type: string
        required: true
      - name: issue_number
        type: integer
        required: true

  - name: create_issue
    description: Create a new issue
    parameters:
      - name: repo_full_name
        type: string
        required: true
      - name: title
        type: string
        required: true
      - name: body
        type: string
        optional: true
      - name: labels
        type: list
        optional: true
      - name: milestone
        type: integer
        optional: true

  - name: add_issue_comment
    description: Add a comment to an issue
    parameters:
      - name: repo_full_name
        type: string
        required: true
      - name: issue_number
        type: integer
        required: true
      - name: body
        type: string
        required: true

  - name: list_pull_requests
    description: List pull requests for a repository
    parameters:
      - name: repo_full_name
        type: string
        required: true
      - name: state
        type: string
        default: "open"
      - name: limit
        type: integer
        default: 30
      - name: page
        type: integer
        default: 1

  - name: get_pull_request
    description: Get a single pull request
    parameters:
      - name: repo_full_name
        type: string
        required: true
      - name: pr_number
        type: integer
        required: true

  - name: create_pull_request
    description: Create a new pull request
    parameters:
      - name: repo_full_name
        type: string
        required: true
      - name: title
        type: string
        required: true
      - name: head
        type: string
        required: true
      - name: base
        type: string
        required: true
      - name: body
        type: string
        optional: true

  - name: get_user
    description: Get user information
    parameters:
      - name: username
        type: string
        required: true

  - name: get_authenticated_user
    description: Get information about the authenticated user
    parameters: []

  - name: list_orgs
    description: List organizations the authenticated user belongs to
    parameters: []

  - name: get_org
    description: Get organization information
    parameters:
      - name: org_name
        type: string
        required: true

  - name: get_repo_clone_url
    description: Get the clone URL for a repository
    parameters:
      - name: repo_full_name
        type: string
        required: true
      - name: protocol
        type: string
        default: "https"
        options: [https, ssh, git]

# Usage patterns
triggers:
  - "Codeberg"
  - "repository management"
  - "issue tracking"
  - "pull request"
  - "create repo"
  - "list issues"

# Requirements
requires_authentication: true  # For write operations
requires_network: true
requires_file_access: false

# Dependencies
python_dependencies:
  - aiohttp

# Testing
test_import: "from codeberg_connector import CodebergClient, SyncCodebergClient"
