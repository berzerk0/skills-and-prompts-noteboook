# Repository Auditor Skill - Canonical Definition

name: repo-auditor
description: Audit repository structure, skills, and cross-agent compatibility. Use when user requests repository analysis, skill inventory, structure validation, or compliance checking.
license: MIT
compatibility: [claude, pi, vibe]

# Skill type classification
skill_type: type_c  # File operations - reads repo structure, validates files

# This skill primarily reads and analyzes files, no external API
implementation_module: null  # Pure instructional skill, no Python implementation needed

# Trigger patterns
triggers:
  - "audit this repo"
  - "audit the repository"
  - "check repo structure"
  - "validate skills"
  - "inventory skills"
  - "check cross-agent compatibility"
  - "find issues in the repo"
  - "repository health check"
  - "what skills are available"
  - "are all skills properly configured"
  - "audit skills"

# Requirements
requires_authentication: false
requires_network: false
requires_file_access: true  # Needs to read repo files

# Audit scope
category: repository-management
audit_targets:
  - repository_structure
  - skill_inventory
  - per_agent_configurations
  - symlink_validation
  - cross_agent_compatibility
  - implementation_audit
  - documentation_audit
